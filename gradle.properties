# -------------------------------------------------------------
# Gradle Build Performance Optimizations
# -------------------------------------------------------------

# JVM Memory: Increased to 4GB with ParallelGC for fast compilation throughput
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle Execution & Caching Features
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.tooling.parallel=true

# Kotlin Compiler Optimizations: run in daemon with warm incremental cache
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Kapt Annotation Processing Performance
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false

# Android Flags
android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=false
android.nonTransitiveRClass=false
android.suppressUnsupportedCompileSdk=35,36

